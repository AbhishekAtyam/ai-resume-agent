# Streamlit theme — dark base so native widgets (dropdowns, dataframes) match
# the custom neon CSS injected in ui/theme.py.
[theme]
base = "dark"
primaryColor = "#8ab4f8"
backgroundColor = "#202124"
secondaryBackgroundColor = "#292a2d"
textColor = "#e8eaed"
font = "sans serif"

[server]
headless = true
